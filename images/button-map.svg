<svg width="820" height="560" viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>DDR button and switch mapping</title>
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Button &amp; switch map</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#5f5e5a">Which physical control lights which segment</text>

  <!-- the 7-segment digit -->
  <g>
    <rect x="356" y="90" width="88" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <rect x="340" y="106" width="16" height="86" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
    <rect x="444" y="106" width="16" height="86" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <rect x="356" y="192" width="88" height="16" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
    <rect x="340" y="208" width="16" height="86" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <rect x="444" y="208" width="16" height="86" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <rect x="356" y="294" width="88" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
  </g>

  <!-- leader lines + labels, right side -->
  <line x1="444" y1="98"  x2="500" y2="98"  stroke="#b4b2a9" stroke-width="1"/>
  <text x="508" y="102" font-size="14" fill="#2c2c2a">a &#8212; BTNU</text>

  <line x1="460" y1="149" x2="500" y2="149" stroke="#b4b2a9" stroke-width="1"/>
  <text x="508" y="153" font-size="14" fill="#2c2c2a">b &#8212; BTNR</text>

  <line x1="444" y1="200" x2="500" y2="200" stroke="#b4b2a9" stroke-width="1"/>
  <text x="508" y="204" font-size="14" fill="#2c2c2a">g &#8212; SG (switch)</text>

  <line x1="460" y1="251" x2="500" y2="251" stroke="#b4b2a9" stroke-width="1"/>
  <text x="508" y="255" font-size="14" fill="#2c2c2a">c &#8212; BTNC</text>

  <line x1="444" y1="302" x2="500" y2="302" stroke="#b4b2a9" stroke-width="1"/>
  <text x="508" y="306" font-size="14" fill="#2c2c2a">d &#8212; BTND</text>

  <!-- leader lines + labels, left side -->
  <line x1="340" y1="149" x2="280" y2="149" stroke="#b4b2a9" stroke-width="1"/>
  <text x="272" y="153" font-size="14" fill="#2c2c2a" text-anchor="end">f &#8212; SF (switch)</text>

  <line x1="340" y1="251" x2="280" y2="251" stroke="#b4b2a9" stroke-width="1"/>
  <text x="272" y="255" font-size="14" fill="#2c2c2a" text-anchor="end">e &#8212; BTNL</text>

  <!-- legend -->
  <rect x="560" y="88" width="14" height="14" rx="3" fill="#B5D4F4" stroke="#185FA5"/>
  <text x="580" y="99" font-size="13" fill="#2c2c2a">button</text>
  <rect x="650" y="88" width="14" height="14" rx="3" fill="#FAC775" stroke="#854F0B"/>
  <text x="670" y="99" font-size="13" fill="#2c2c2a">switch</text>

  <!-- 4-digit display strip / digit select -->
  <g>
    <rect x="40" y="360" width="170" height="72" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <text x="125" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">digit 3 (leftmost)</text>
    <text x="125" y="408" text-anchor="middle" font-size="13" fill="#185FA5">S = 1 targets this</text>

    <rect x="225" y="360" width="170" height="72" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <text x="310" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">digit 2</text>
    <text x="310" y="408" text-anchor="middle" font-size="13" fill="#185FA5">S = 0 targets this</text>

    <rect x="410" y="360" width="185" height="72" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
    <text x="502" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">digit 1 (score tens)</text>
    <text x="502" y="408" text-anchor="middle" font-size="13" fill="#5f5e5a">automatic, no button</text>

    <rect x="610" y="360" width="185" height="72" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
    <text x="702" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">digit 0 (score ones)</text>
    <text x="702" y="408" text-anchor="middle" font-size="13" fill="#5f5e5a">automatic, no button</text>
  </g>

  <!-- legend box: R / P / BTNC note -->
  <rect x="40" y="456" width="740" height="86" rx="10" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="58" y="482" font-size="14" fill="#2c2c2a">R (SW0) &#8212; reset, forces OFF from any state</text>
  <text x="58" y="504" font-size="14" fill="#2c2c2a">P (SW1) &#8212; pause, freezes panning and gameplay</text>
  <text x="58" y="526" font-size="14" fill="#2c2c2a">BTNC also advances the mode (OFF &#8594; START &#8594; ...) on its rising edge</text>
</svg>
