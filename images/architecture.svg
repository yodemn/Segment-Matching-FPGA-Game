<svg width="900" height="540" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>DDR system architecture</title>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">System architecture</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5f5e5a">the controller schedules; the datapath does every bit of actual work</text>

  <!-- outer ddr_top container -->
  <rect x="40" y="82" width="820" height="400" rx="16" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="106" font-size="13" fill="#5f5e5a" font-weight="bold">ddr_top</text>

  <!-- controller -->
  <rect x="70" y="122" width="180" height="320" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <text x="160" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#26215C">controller</text>
  <text x="160" y="180" text-anchor="middle" font-size="12" fill="#3C3489">mode FSM</text>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#3C3489">5 states, zero data</text>
  <text x="160" y="218" text-anchor="middle" font-size="11" fill="#3C3489">no submodules</text>
  <text x="160" y="410" text-anchor="middle" font-size="11" fill="#3C3489" font-style="italic">"what mode are we in?"</text>

  <!-- connecting arrows -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <line x1="250" y1="200" x2="290" y2="200" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="290" y1="360" x2="250" y2="360" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- datapath -->
  <rect x="290" y="122" width="550" height="320" rx="12" fill="#E8F7F1" stroke="#0F6E56" stroke-width="1"/>
  <text x="310" y="150" font-size="17" font-weight="bold" fill="#04342C">datapath</text>
  <text x="310" y="170" font-size="12" fill="#085041">six blocks + shared clock/edge-detect plumbing</text>

  <!-- 6 blocks -->
  <g>
    <rect x="310" y="195" width="160" height="62" rx="8" fill="#ffffff" stroke="#6B6B6B" stroke-width="1"/>
    <text x="390" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">input_mapper</text>
    <text x="390" y="234" text-anchor="middle" font-size="10.5" fill="#5f5e5a">buttons &#8594; seg_hit</text>
  </g>
  <g>
    <rect x="485" y="195" width="160" height="62" rx="8" fill="#ffffff" stroke="#6B6B6B" stroke-width="1"/>
    <text x="565" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">target_generator</text>
    <text x="565" y="234" text-anchor="middle" font-size="10.5" fill="#5f5e5a">owns the game board</text>
  </g>
  <g>
    <rect x="660" y="195" width="160" height="62" rx="8" fill="#ffffff" stroke="#6B6B6B" stroke-width="1"/>
    <text x="740" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">hit_miss_math</text>
    <text x="740" y="234" text-anchor="middle" font-size="10.5" fill="#5f5e5a">checks hits, keeps score</text>
  </g>
  <g>
    <rect x="310" y="272" width="160" height="62" rx="8" fill="#ffffff" stroke="#6B6B6B" stroke-width="1"/>
    <text x="390" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">game_timer</text>
    <text x="390" y="311" text-anchor="middle" font-size="10.5" fill="#5f5e5a">counts the round down</text>
  </g>
  <g>
    <rect x="485" y="272" width="160" height="62" rx="8" fill="#ffffff" stroke="#6B6B6B" stroke-width="1"/>
    <text x="565" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">scrolling_text</text>
    <text x="565" y="311" text-anchor="middle" font-size="10.5" fill="#5f5e5a">pans OFF/START/end text</text>
  </g>
  <g>
    <rect x="660" y="272" width="160" height="62" rx="8" fill="#ffffff" stroke="#6B6B6B" stroke-width="1"/>
    <text x="740" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">graphics_router</text>
    <text x="740" y="311" text-anchor="middle" font-size="10.5" fill="#5f5e5a">picks what's on screen</text>
  </g>

  <rect x="310" y="354" width="510" height="34" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="565" y="375" text-anchor="middle" font-size="11.5" fill="#5f5e5a">plus 4 clock dividers and 2 edge detectors, shared across the blocks above</text>
  <text x="565" y="410" text-anchor="middle" font-size="11.5" fill="#085041" font-style="italic">"what's the current game state, and what shows on the display?"</text>

  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#5f5e5a">8 control signals flow controller &#8594; datapath &#160;&#8226;&#160; 2 status signals (c_edge, round_over) flow back</text>
</svg>
