<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>DDR gameplay mechanics, example round in progress</title>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Gameplay, mid-round example</text>

  <!-- Timer bar -->
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5f5e5a">12-LED timer bar &#8212; counts down as the round plays</text>
  <g id="timerbar">
    <rect x="205" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="255" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="305" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="355" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="405" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="455" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="505" y="82" width="40" height="24" rx="5" fill="#97C459" stroke="#3B6D11"/>
    <rect x="555" y="82" width="40" height="24" rx="5" fill="#F1EFE8" stroke="#b4b2a9"/>
    <rect x="605" y="82" width="40" height="24" rx="5" fill="#F1EFE8" stroke="#b4b2a9"/>
    <rect x="655" y="82" width="40" height="24" rx="5" fill="#F1EFE8" stroke="#b4b2a9"/>
    <rect x="705" y="82" width="40" height="24" rx="5" fill="#F1EFE8" stroke="#b4b2a9"/>
    <rect x="755" y="82" width="40" height="24" rx="5" fill="#F1EFE8" stroke="#b4b2a9"/>
  </g>

  <!-- S-select labels above board digits -->
  <text x="137" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#993C1D">S = 1 targets this</text>
  <line x1="137" y1="146" x2="137" y2="168" stroke="#993C1D" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="267" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#993C1D">S = 0 targets this</text>
  <line x1="267" y1="146" x2="267" y2="168" stroke="#993C1D" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- digit3 (board, S=1) example: segments a, c, e lit (target pattern) -->
  <g>
    <rect x="118" y="170" width="54" height="10" rx="3" fill="#F0997B" stroke="#993C1D"/>
    <rect x="100" y="180" width="10" height="52" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="162" y="180" width="10" height="52" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="118" y="234" width="54" height="10" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="100" y="246" width="10" height="52" rx="3" fill="#F0997B" stroke="#993C1D"/>
    <rect x="162" y="246" width="10" height="52" rx="3" fill="#F0997B" stroke="#993C1D"/>
    <rect x="118" y="300" width="54" height="10" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
  </g>

  <!-- digit2 (board, S=0) example: all unlit -->
  <g>
    <rect x="248" y="170" width="54" height="10" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="230" y="180" width="10" height="52" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="292" y="180" width="10" height="52" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="248" y="234" width="54" height="10" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="230" y="246" width="10" height="52" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="292" y="246" width="10" height="52" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
    <rect x="248" y="300" width="54" height="10" rx="3" fill="#F1EFE8" stroke="#d3d1c7"/>
  </g>

  <text x="200" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">game board</text>
  <text x="200" y="352" text-anchor="middle" font-size="12" fill="#712B13">orange segments are lit &#8212; clear them for points</text>

  <!-- divider -->
  <line x1="380" y1="150" x2="380" y2="360" stroke="#d3d1c7" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- digit1 = "0", digit0 = "7" (score, neutral color) -->
  <g>
    <rect x="488" y="170" width="54" height="10" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="470" y="180" width="10" height="52" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="532" y="180" width="10" height="52" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="470" y="246" width="10" height="52" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="532" y="246" width="10" height="52" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="488" y="300" width="54" height="10" rx="3" fill="#85B7EB" stroke="#185FA5"/>
  </g>
  <g>
    <rect x="618" y="170" width="54" height="10" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="662" y="180" width="10" height="52" rx="3" fill="#85B7EB" stroke="#185FA5"/>
    <rect x="662" y="246" width="10" height="52" rx="3" fill="#85B7EB" stroke="#185FA5"/>
  </g>

  <text x="600" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">score: 07</text>
  <text x="600" y="352" text-anchor="middle" font-size="12" fill="#0C447C">automatic &#8212; goes up whenever you clear a lit segment</text>

  <!-- instruction box -->
  <rect x="80" y="400" width="840" height="130" rx="10" fill="#F1EFE8" stroke="#b4b2a9" stroke-width="1"/>
  <text x="500" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">how to clear a segment</text>
  <text x="500" y="454" text-anchor="middle" font-size="13" fill="#2c2c2a">1. flip S to pick the digit you want to aim at (up = left digit, down = right digit)</text>
  <text x="500" y="476" text-anchor="middle" font-size="13" fill="#2c2c2a">2. press the button (or flip SF / SG) matching a lit segment on that digit &#8212; score +1</text>
  <text x="500" y="498" text-anchor="middle" font-size="13" fill="#2c2c2a">3. pressing something on an unlit segment just flashes it &#8212; no penalty, no points</text>
  <text x="500" y="520" text-anchor="middle" font-size="13" fill="#2c2c2a">new segments keep spawning on both digits until the timer runs out</text>
</svg>
