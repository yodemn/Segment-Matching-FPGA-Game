<svg width="1040" height="400" viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>DDR game flow, five phases</title>
  <rect x="0" y="0" width="1040" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Game flow</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#5f5e5a">Every arrow below is a BTNC press, except one automatic step</text>

  <!-- OFF -->
  <g>
    <rect x="40" y="100" width="160" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="120" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c2c2a">OFF</text>
    <text x="120" y="152" text-anchor="middle" font-size="12" fill="#5f5e5a">LED 0001</text>
    <text x="120" y="170" text-anchor="middle" font-size="12" fill="#5f5e5a">static "OFF"</text>
  </g>

  <!-- START -->
  <g>
    <rect x="235" y="100" width="160" height="90" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
    <text x="315" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#26215C">START</text>
    <text x="315" y="152" text-anchor="middle" font-size="12" fill="#3C3489">LED 0010</text>
    <text x="315" y="170" text-anchor="middle" font-size="12" fill="#3C3489">pans "START"</text>
  </g>

  <!-- GAMEPLAY -->
  <g>
    <rect x="430" y="100" width="160" height="90" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
    <text x="510" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#04342C">GAMEPLAY</text>
    <text x="510" y="152" text-anchor="middle" font-size="12" fill="#085041">LED 0100</text>
    <text x="510" y="170" text-anchor="middle" font-size="12" fill="#085041">clear segments!</text>
  </g>

  <!-- DONE_SCORE -->
  <g>
    <rect x="625" y="100" width="160" height="90" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
    <text x="705" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A1B0C">DONE</text>
    <text x="705" y="144" text-anchor="middle" font-size="12" fill="#4A1B0C">(score hold)</text>
    <text x="705" y="162" text-anchor="middle" font-size="12" fill="#712B13">LED 1000</text>
    <text x="705" y="178" text-anchor="middle" font-size="12" fill="#712B13">shows final score</text>
  </g>

  <!-- DONE_TEXT -->
  <g>
    <rect x="820" y="100" width="160" height="90" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
    <text x="900" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A1B0C">DONE</text>
    <text x="900" y="144" text-anchor="middle" font-size="12" fill="#4A1B0C">(ddr end)</text>
    <text x="900" y="162" text-anchor="middle" font-size="12" fill="#712B13">LED 1000</text>
    <text x="900" y="178" text-anchor="middle" font-size="12" fill="#712B13">pans "ddr end"</text>
  </g>

  <!-- forward arrows -->
  <line x1="200" y1="145" x2="230" y2="145" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="215" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">BTNC</text>

  <line x1="395" y1="145" x2="425" y2="145" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">BTNC</text>

  <line x1="590" y1="145" x2="620" y2="145" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="605" y="110" text-anchor="middle" font-size="10.5" fill="#5f5e5a">timer / score / board</text>
  <text x="605" y="122" text-anchor="middle" font-size="10.5" fill="#5f5e5a">(automatic)</text>

  <line x1="785" y1="145" x2="815" y2="145" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="800" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">BTNC</text>

  <!-- loop back DONE_TEXT -> OFF -->
  <path d="M900 190 C 900 300, 120 300, 120 192" fill="none" stroke="#5f5e5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="510" y="316" text-anchor="middle" font-size="12" fill="#5f5e5a">BTNC (back to OFF, loop restarts)</text>

  <!-- reset note -->
  <rect x="40" y="345" width="940" height="40" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="510" y="370" text-anchor="middle" font-size="13" fill="#2c2c2a">R (SW0) jumps straight back to OFF from any of these five phases, instantly</text>
</svg>
